# Light checks on every push to main and every pull request: Rust tests on the three platforms
# and a syntax check of the plugin scripts. Releases are built by release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (Tauri v2 prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Check app and hook script syntax (sh)
        run: |
          sh -n scripts/bop.sh
          sh -n hooks/bop-hook.sh

      - name: Check app and hook script syntax (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in 'scripts/bop.ps1', 'hooks/bop-hook.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }
