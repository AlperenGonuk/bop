# Builds the Bop app for Windows, macOS and Linux and attaches the raw executables plus
# SHA256SUMS to a draft GitHub release. The README and /bop setup name these files:
#   bop-<version>-windows-x64.exe, bop-<version>-macos-arm64, bop-<version>-macos-x64,
#   bop-<version>-linux-x64, SHA256SUMS
# Tag v<version> must match the version in Cargo.toml, tauri.conf.json and plugin.json.
# workflow_dispatch builds the same files as a workflow artifact without making a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Check that all versions agree
        shell: bash
        run: |
          set -euo pipefail
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -n 1)
          tauri_v=$(jq -r .version app/src-tauri/tauri.conf.json)
          plugin_v=$(jq -r .version .claude-plugin/plugin.json)
          echo "Cargo.toml=$cargo_v tauri.conf.json=$tauri_v plugin.json=$plugin_v"
          if [ "$cargo_v" != "$tauri_v" ] || [ "$cargo_v" != "$plugin_v" ]; then
            echo "::error::versions differ"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_v"; exit 1
          fi
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: .exe
            native: true
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
            native: true
          # Cross-compiled on the Apple silicon runner; tests run only on native builds.
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x64
            ext: ""
            native: false
          # Oldest available Ubuntu runner, so the binary links against an older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: ""
            native: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (Tauri v2 prerequisites)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.native
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the executable
        run: |
          set -euo pipefail
          name="bop-${{ needs.version.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "target/${{ matrix.target }}/release/bop${{ matrix.ext }}" "$GITHUB_WORKSPACE/dist/$name"
          chmod +x "$GITHUB_WORKSPACE/dist/$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Smoke test (--version)
        if: matrix.native
        run: |
          set -euo pipefail
          out=$("$GITHUB_WORKSPACE/dist/$ASSET" --version)
          echo "$out"
          [ "$out" = "bop ${{ needs.version.outputs.version }}" ]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bop-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          for p in windows-x64.exe macos-arm64 macos-x64 linux-x64; do
            [ -f "bop-$v-$p" ] || { echo "::error::missing bop-$v-$p"; exit 1; }
          done
          sha256sum bop-* > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the files as a workflow artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

      # A draft is not public: review it on GitHub and press Publish. The install scripts can
      # only download from a published release.
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "Bop $VERSION" \
            --notes "Executables for the Bop plugin (download one and open it once, see the README). Check them against SHA256SUMS."
