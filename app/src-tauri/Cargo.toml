[package]
name = "bop"
version = "0.2.0"
description = "A desktop pet for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "bop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# Don't treat the MSVC linker's info line for the cdylib as a warning.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The drawing engine (bop hatch) writes PNGs; already in Tauri's dependency tree (DECISIONS 27).
png = "0.18"
