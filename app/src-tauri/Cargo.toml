[package]
name = "bop"
version = "0.1.0"
description = "A desktop pet for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "bop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# MSVC linker'ın cdylib için yazdığı bilgi satırı uyarı sayılmasın.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Çizim motoru (bop hatch) PNG yazar; Tauri ağacında zaten var (KARARLAR 27).
png = "0.18"
