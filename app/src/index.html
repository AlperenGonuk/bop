<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bop</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <section id="panel" hidden>
    <div id="bubble">
      <header>
        <span id="folder" title=""></span>
        <button id="new-chat" type="button" title="New chat">✚</button>
        <button id="to-terminal" type="button" title="Open in terminal" disabled>⧉</button>
        <button id="close" type="button" title="Close (Esc)">×</button>
      </header>
      <div id="messages" aria-live="polite"></div>
      <form id="form">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea id="input" rows="1" placeholder="type a message…" aria-label="Message"></textarea>
        <button id="send" type="submit" title="Send (Enter)">↵</button>
      </form>
    </div>
  </section>
  <canvas id="pet"></canvas>
  <div id="error" hidden></div>
</body>
</html>
